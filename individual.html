<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/normalize.css" />

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/featherlight.min.css" />
    <title>Solar Panel installations</title>
  </head>
  <body>
    <h1 class="title">This is for our Home Owners !</h1>

    <form id="calcForm">
      <label for="location">Location</label><br />
      <input
        type="text"
        id="location"
        name="location"
        placeholder="Location"
      /><br />
      <label for="energyBill">Your average Energy Bill</label><br />
      <input
        type="number"
        id="energyBill"
        name="energyBill"
        placeholder="Energy Bill"
      />
    </form>
    <div class="wrapper">
      <form>
        <input type="radio" id="option1" name="outlayOption" value="option1" />
        <label for="option1">Plan 1</label><br />
        <input type="radio" id="option2" name="outlayOption" value="option2" />
        <label for="option2">Plan 2</label><br />
        <input type="radio" id="option3" name="outlayOption" value="option3" />
        <label for="option3">Plan 3</label><br />
      </form>
      <button type="button" id="calcBtn">Calculate</button>
      <p id="result"></p>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
